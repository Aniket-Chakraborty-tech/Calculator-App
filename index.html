<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="desk">
    <main class="device" role="application" aria-label="Calculator">

        <div class="display" id="display">
            <div class="display__glass">
                <div class="display__expression" id="expression" aria-hidden="true"></div>
                <div class="display__result" id="result">0</div>
            </div>
            <div class="display__label">MODEL&nbsp;01&nbsp;&middot;&nbsp;NODE</div>
        </div>

        <div class="keys" id="keys">
            <button class="key key--func" data-action="clear">C</button>
            <button class="key key--func" data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="key key--func" data-value="%">%</button>
            <button class="key key--op" data-value="/">÷</button>

            <button class="key key--num" data-value="7">7</button>
            <button class="key key--num" data-value="8">8</button>
            <button class="key key--num" data-value="9">9</button>
            <button class="key key--op" data-value="*">×</button>

            <button class="key key--num" data-value="4">4</button>
            <button class="key key--num" data-value="5">5</button>
            <button class="key key--num" data-value="6">6</button>
            <button class="key key--op" data-value="-">−</button>

            <button class="key key--num" data-value="1">1</button>
            <button class="key key--num" data-value="2">2</button>
            <button class="key key--num" data-value="3">3</button>
            <button class="key key--op" data-value="+">+</button>

            <button class="key key--func" data-value="(">(</button>
            <button class="key key--num" data-value="0">0</button>
            <button class="key key--num" data-value=".">.</button>
            <button class="key key--func" data-value=")">)</button>

            <button class="key key--equals" data-action="equals">=</button>
        </div>

        <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
